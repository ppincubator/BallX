[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ballx-gpid"
version = "0.1.0"
description = "Evidence-traceable Global Pitch Intelligence Database"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.16,<1",
  "pydantic-settings>=2.5,<3",
  "tzdata>=2024.2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
ballx-ingest = "ballx.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires a dedicated PostgreSQL/PostGIS test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
