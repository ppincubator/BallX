name: Milestone 1 checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: ballx_test
          POSTGRES_USER: ballx
          POSTGRES_PASSWORD: ballx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ballx -d ballx_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ballx:ballx_test@localhost:5432/ballx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests migrations
      - run: ruff format --check src tests migrations
      - run: pytest -q
